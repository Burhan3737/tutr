<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tutr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5bb7%22/%3E%3Cpath d=%22M9 22V10h8a4 4 0 010 8h-8%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="session-bar" id="session-bar" hidden></div>
<header class="top">
  <button class="icon-btn nav-btn" id="nav-btn" type="button" aria-controls="sidenav" aria-expanded="false" title="Topics sidebar ( [ )" aria-label="Show or hide the topics sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#" aria-label="Tutr home">Tutr</a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <button class="icon-btn" id="search-btn" type="button" aria-label="Search all slides (Ctrl K)" title="Search all slides (Ctrl K)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
  <button class="icon-btn" id="menu-btn" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">⋯</button>
</header>

<div class="body-row">
  <aside class="sidenav" id="sidenav" aria-label="Topics" hidden></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="nav-scrim" id="nav-scrim" hidden></div>

<div class="menu" id="menu" role="menu" hidden>
  <button role="menuitem" type="button" data-act="history">History</button>
  <label class="menu-row">Model <select id="model-pick"></select></label>
  <label class="menu-row" id="slides-only-row"><input type="checkbox" id="slides-only"> Stick to slides <span class="muted" id="slides-only-course"></span></label>
  <label class="menu-row" id="dict-preview-row"><input type="checkbox" id="dict-preview"> Show words while dictating</label>
  <button role="menuitem" type="button" data-act="phone" id="phone-item" hidden>Open on your phone</button>
  <button role="menuitem" type="button" data-act="usage">Usage <span class="muted" id="usage-sum"></span></button>
</div>

<div class="overlay" id="search" hidden>
  <div class="search-box" role="dialog" aria-label="Search all slides">
    <input id="search-input" type="search" placeholder="Search all slides" autocomplete="off" aria-label="Search all slides">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<dialog class="dlg" id="history-dlg">
  <div class="dlg-head"><h2 id="history-title">History</h2><form method="dialog"><button class="icon-btn" aria-label="Close">×</button></form></div>
  <div id="history-list"></div>
</dialog>

<dialog class="dlg" id="usage-dlg">
  <div class="dlg-head"><h2>Usage</h2><form method="dialog"><button class="icon-btn" aria-label="Close">×</button></form></div>
  <div id="usage-body"></div>
</dialog>

<dialog class="dlg" id="qr-dlg">
  <div class="dlg-head"><h2 id="qr-title">Open on your phone</h2><form method="dialog"><button class="icon-btn" aria-label="Close">×</button></form></div>
  <p id="qr-text">Connect your phone to the same Wi-Fi, then scan this with its camera.</p>
  <div class="qr" id="qr"></div>
  <p class="muted small" id="qr-url"></p>
</dialog>

<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>

<script src="vendor/qrcode.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="visuals.js"></script>
<script src="drafts.js"></script>
<script src="app.js"></script>
</body>
</html>
